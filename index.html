<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babá Eletrônica - Visualizador</title>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        video {
            width: 100%;
            max-width: 800px;
            height: auto;
            background: #222;
            border-radius: 8px;
        }
        #status {
            margin-top: 15px;
            font-size: 16px;
            color: #00FFCC;
        }
    </style>
</head>
<body>

    <h2>Babá Eletrônica - Em Direto</h2>
    <video id="remoteVideo" autoplay playsinline controls></video>
    <div id="status">A aguardar ligação com a câmara...</div>

    <!-- Firebase SDK (Compat version) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            databaseURL: "https://babaeletronicalks-default-rtdb.firebaseio.com/"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Obter o ID da sala a partir do hash do URL (ex: #baba-1a2b3c4d)
        const idSala = window.location.hash.substring(1);
        const statusDiv = document.getElementById("status");
        const remoteVideo = document.getElementById("remoteVideo");

        if (!idSala) {
            statusDiv.innerText = "Erro: Nenhuma sala especificada no URL (ex: index.html#baba-xyz)";
        } else {
            statusDiv.innerText = "A ligar à sala: " + idSala;
            
            const salaRef = db.ref("salas/" + idSala);
            
            const pcConfig = {
                iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
            };

            const pc = new RTCPeerConnection(pcConfig);

            pc.ontrack = (event) => {
                console.log("Stream remoto recebido!");
                remoteVideo.srcObject = event.streams[0];
                statusDiv.innerText = "🔴 Transmissão em direto ativa!";
            };

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    salaRef.child("calleeCandidates").push(event.candidate.toJSON());
                }
            };

            // Ouvir a Oferta (Offer) enviada pela aplicação Android
            salaRef.child("offer").on("value", async (snapshot) => {
                const offer = snapshot.val();
                if (offer && !pc.currentRemoteDescription) {
                    statusDiv.innerText = "A estabelecer conexão WebRTC...";
                    await pc.setRemoteDescription(new RTCSessionDescription(offer));

                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);

                    await salaRef.child("answer").setValue({
                        type: answer.type,
                        sdp: answer.sdp
                    });
                    statusDiv.innerText = "Resposta enviada, a aguardar vídeo...";
                }
            });

            // Ouvir candidatos ICE do Android
            salaRef.child("callerCandidates").on("child_added", (snapshot) => {
                const candidate = snapshot.val();
                if (candidate) {
                    pc.addIceCandidate(new RTCIceCandidate(candidate)).catch(e => console.error(e));
                }
            });
        }
    </script>
</body>
</html>
