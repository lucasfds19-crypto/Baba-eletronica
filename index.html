<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babá Eletrônica - Ao Vivo</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
        video { width: 100%; max-width: 600px; border-radius: 12px; border: 2px solid #00ff88; background: #000; margin-top: 15px; }
        .status { margin-top: 10px; font-weight: bold; color: #ffcc00; }
    </style>

    <!-- SDK do Firebase (Versão Web) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <h2>Babá Eletrônica - Monitoramento</h2>
    <div id="status" class="status">Aguardando sinal da câmera...</div>
    <video id="remoteVideo" autoplay playsinline controls></video>

    <script>
        // Configuração do Firebase (Substituiremos pelas suas chaves na Parte 2)
        const firebaseConfig = {
            databaseURL: "HTTPS://SEU-PROJETO-DEFAULT-RTDB.FIREBASEIO.COM"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Obtém o ID da Sala a partir do final da URL (ex: #baba-1234)
        const idSala = window.location.hash.substring(1);
        const statusDiv = document.getElementById('status');
        const remoteVideo = document.getElementById('remoteVideo');

        if (!idSala) {
            statusDiv.innerText = "Erro: Nenhuma sala especificada no link.";
        } else {
            iniciarWebRTC(idSala);
        }

        function iniciarWebRTC(sala) {
            const rtcConfig = {
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            };
            const pc = new RTCPeerConnection(rtcConfig);
            const salaRef = db.ref('salas/' + sala);

            pc.ontrack = (event) => {
                remoteVideo.srcObject = event.streams[0];
                statusDiv.innerText = "Ao Vivo 🔴";
                statusDiv.style.color = "#00ff88";
            };

            // Ouve as Ofertas (SDP) enviadas pela câmera em Java
            salaRef.child('oferta').on('value', async (snapshot) => {
                const oferta = snapshot.val();
                if (oferta && !pc.currentRemoteDescription) {
                    await pc.setRemoteDescription(new RTCSessionDescription(oferta));
                    const resposta = await pc.createAnswer();
                    await pc.setLocalDescription(resposta);
                    salaRef.child('resposta').set(resposta);
                }
            });

            // Recebe os candidatos de rede (ICE) da câmera
            salaRef.child('candidatosCamera').on('child_added', (snapshot) => {
                const candidato = snapshot.val();
                if (candidato) {
                    pc.addIceCandidate(new RTCIceCandidate(candidato));
                }
            });

            // Envia os candidatos de rede do navegador de volta para a câmera
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    salaRef.child('candidatosViewer').push(event.candidate.toJSON());
                }
            };
        }
    </script>
</body>
</html>
